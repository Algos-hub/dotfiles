# List of plugins
unbind r
bind r  source-file ~/.tmux.conf

unbind C-b
set -g prefix C-Space
bind C-b send-prefix

set -g @tpm-clean 'r'
set -g default-terminal "xterm-256color"
set-option -sa terminal-features ",xterm-256color:RGB"

set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind -n C-p previous-window
bind -n C-n next-window

bind -r k switch-client -p
bind -r j switch-client -n

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'o0th/tmux-nova'

            # default = { left = "", right = " " },
set -g @nova-nerdfonts true
set -g @nova-nerdfonts-right 
set -g @nova-nerdfonts-left 

set -g @nova-segment-session "#{session_name}"
set -g @nova-segment-session-colors "#ea9a97 #232136"
set -g status-left-length  100

set -g @nova-segment-whereami "#(echo #{pane_current_path} | sed 's#$HOME#~#g')"
set -g @nova-segment-whereami-colors "#ea9a97 #232136"

set -g @nova-status-style-bg "#232135"
set -g @nova-status-style-fg "#e0def4"
set -g @nova-status-style-active-bg "#44415a"
set -g @nova-status-style-active-fg "#e0def4"
#
set -g @nova-pane "#I#{?pane_in_mode,  #{pane_mode},}  #W"

set -g @nova-rows 0
set -g @nova-segments-0-left "session"
set -g @nova-segments-0-right "whereami"

set -g pane-border-status off
set -g pane-border-format " [ #T ] "
set-hook -g 'after-new-session'  'run-shell -b "if [ \#{window_panes} -eq 1 ]; then tmux set pane-border-status off; fi"'
set-hook -g 'after-new-window'   'run-shell -b "if [ \#{window_panes} -eq 1 ]; then tmux set pane-border-status off; fi"'
set-hook -g 'after-kill-pane'    'run-shell -b "if [ \#{window_panes} -eq 1 ]; then tmux set pane-border-status off; fi"'
set-hook -g 'pane-exited'        'run-shell -b "if [ \#{window_panes} -eq 1 ]; then tmux set pane-border-status off; fi"'
set-hook -g 'after-split-window' 'run-shell -b "if [ \#{window_panes} -gt 1 ]; then tmux set pane-border-status top; fi"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

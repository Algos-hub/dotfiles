general {
    lock_cmd         = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session            # lock before suspend.
    after_sleep_cmd  = hyprctl dispatch dpms on && ddcutil setvcp 10 -- display 1 100     # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout    = 150                                   # 2.5min.
    on-timeout = ddcutil setvcp 10 --display 1 10      # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume  = ddcutil setvcp 10 --display 1 100     # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout    = 150                    # 2.5min.
}

listener {
    timeout    = 300                              # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout    = 330                                                                    # 5.5min
    on-timeout = hyprctl dispatch dpms off                                              # screen off when timeout has passed
    on-resume  = hyprctl dispatch dpms on && ddcutil setvcp 10 -- display 1 100         # screen on when activity is detected after timeout has fired.
}

listener {
    timeout    = 1800                             # 30min
    on-timeout = systemctl suspend                # suspend pc
}

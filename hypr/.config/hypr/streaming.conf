# ~~~~~~~~~~~~~~~~~~~~~~~~ STREAMING MODE ~~~~~~~~~~~~~~~~~~~~~~~~~~
submap = Streaming

bind = $mainMod, F, submap, Focus
bind = $mainMod, R, submap, Resize
bind = $mainMod, M, submap, MoveFocus

# Streaming Submap specific binds
bind = $mainMod,       S,      exec,   pgrep obs > /dev/null 2>&1 && hyprctl dispatch togglespecialworkspace obs || obs
bind = $mainMod SHIFT, S,      submap, reset
bind = $mainMod,       escape, submap, reset

# Quick access to some apps and commands
bind = $mainMod,       Return, exec,       $terminal
bind = $mainMod,       Space,  exec,       $menu
bind = $mainMod,       E,      exec,       $fileManager
bind = $mainMod,       B,      exec,       $browser
bind = $mainMod,       A,      exec,       $easyeffects
bind = $mainMod,       D,      exec,       $ytmusic
bind = $mainMod,       G,      exec,       $screenshot
bind = $mainMod,       P,      exec,       $passwordManager
bind = $mainMod,       C,      exec,       $volumecontrol
bind = $mainMod SHIFT, Space,  exec,       $emojis
bind = $mainMod SHIFT, Q,      killactive,
bind = $mainMod SHIFT, E,      exit,
bind = $mainMod SHIFT, O,      exec,       shutdown -h now

# Switching the window's mode
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod,       V, togglefloating,
bind = $mainMod,       T, togglesplit,
bind = $mainMod,       W, cyclenext

# Cycle through workspaces with $mainMod + HJKL
binde = $mainMod,       H, workspace,       e-1
binde = $mainMod,       J, workspace,       empty
binde = $mainMod,       K, workspace,       1
binde = $mainMod,       L, workspace,       e+1

# Move active window to a workspace with $mainMod + SHIFT + HJKL
binde = $mainMod SHIFT, H, movetoworkspace, r-1
binde = $mainMod SHIFT, J, movetoworkspace, empty
binde = $mainMod SHIFT, K, movetoworkspace, 1
binde = $mainMod SHIFT, L, movetoworkspace, r+1

# Switch workspaces with $mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with $mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Multimedia keys for volume and screen brightness
bindel =      , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+ -l 1
bindel =      , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%- -l 1
bindel = SHIFT, XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+ -l 1
bindel = SHIFt, XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%- -l 1
bindel =      , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel =      , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel =      , XF86AudioPlay,         exec, playerctl play-pause
bindel =      , XF86AudioPrev,         exec, playerctl previous
bindel =      , XF86AudioNext,         exec, playerctl next
bindel =      , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel =      , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindel =      , XF86Sleep,             exec, hyprlock && systemctl suspend

# MOUSE BINDS
# Scroll through existing workspaces with $mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up,   workspace, e+1

# Move/resize windows with $mainMod + LMB/RMB and dragging
bindm = $mainMod,       mouse:272, movewindow
bindm = $mainMod,       mouse:273, resizewindow 1
bindm = $mainMod SHIFT, mouse:273, resizewindow

submap = reset
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~


source=~/.config/hypr/rose-pine-moon.conf
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=HDMI-A-1,1920x1080@100Hz,0x0,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# ========================== APP VARIABLES =========================
# Set programs that you use

$terminal      =   kitty
$fileManager   =   nautilus
$menu          =   pgrep rofi > /dev/null 2>&1 && killall rofi || rofi -show drun -font "JetBrainsMono Nerd Font 21"
$emojis        =   pgrep rofi > /dev/null 2>&1 && killall rofi || rofi -modi emoji -show emoji -kb-secondary-copy "" -kb-custom-1 Return -kb-accept-entry Ctrl+C
$browser       =   firefox
$music         =   tidal-hifi
$volumecontrol =   pgrep pwvucontrol > /dev/null 2>&1 && killall pwvucontrol || pwvucontrol
$screenshot    =   grim
$passwordManager = keepassxc
# ==================================================================





# =========================== AUTOSTART ============================
# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = [workspace special:audio silent] easyeffects
# ==================================================================





# ==================== ENVIRONMENT VARIABLES =======================

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# ==================================================================




# ======================== LOOK AND FEEL ===========================
# Refer to https://wiki.hyprland.org/Configuring/Variables/

cursor {
    no_hardware_cursors = true
}

general {
    gaps_in    = 5
    gaps_out   = 10
    float_gaps = 10

    border_size = 2

    col.active_border   = $iris
    col.inactive_border = $muted

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10

    active_opacity   = 1.0
    inactive_opacity = 1.0

    blur {
        enabled  = true
        size     = 3
        passes   = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows,     1, 5, myBezier
    animation = windowsOut,  1, 5, default, popin 80%
    animation = border,      1, 5, default
    animation = borderangle, 1, 5, default
    animation = fade,        1, 5, default
    animation = workspaces,  1, 5, default
}

dwindle {
    pseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = false
}
# ==================================================================





# =========================== INPUT ================================
# https://wiki.hyprland.org/Configuring/Variables/#input

input {
    kb_layout  = us
    kb_variant =
    kb_model   =
    kb_options =
    kb_rules   =

    follow_mouse  = 1
    scroll_factor = 0.05

    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}

binds {
    hide_special_on_workspace_change = true
}
# ==================================================================





# ========================= KEYBINDINGS ============================
# See https://wiki.hyprland.org/Configuring/Keywords/

$mainMod = SUPER

# ~~~~~~~~~~~~~~~~~~~~~~~~~~ MODAL CHANGES ~~~~~~~~~~~~~~~~~~~~~~~~~~~
# This configuration was designed with different modes in mind,
# kinda like Vim's or Emacs' modal system, but with different keybinds to change said modes
# The navigation for ALL modes are based on Vim's "HJKL"

bind = $mainMod,      F,      submap, focus
bind = $mainMod,      R,      submap, resize
bind = $mainMod,      M,      submap, movefocus
bind = $mainMod CTRL, S,      submap, streaming # Optional
bind = $mainMod,      escape, submap, reset

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



# ~~~~~~~~~~~~~~~~~~~~~~~~~ NORMAL MODE ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# Quick access to some apps and commands
bind = $mainMod,       Return, exec,       $terminal
bind = $mainMod,       Space,  exec,       $menu
bind = $mainMod,       E,      exec,       $fileManager
bind = $mainMod,       B,      exec,       $browser
bind = $mainMod,       N,      exec,       $music
bind = $mainMod,       G,      exec,       $screenshot
bind = $mainMod,       P,      exec,       $passwordManager
bind = $mainMod,       W,      exec,       $volumecontrol
bind = $mainMod SHIFT, Space,  exec,       $emojis
bind = $mainMod SHIFT, Q,      killactive,
bind = $mainMod SHIFT, E,      exit,
bind = $mainMod SHIFT, O,      exec,       shutdown -h now

# Switching the window's mode
bind = $mainMod CTRL, F,      fullscreen
bind = $mainMod,      V,      togglefloating,
bind = $mainMod,      T,      togglesplit,
bind = $mainMod,      C,      cyclenext

# Cycle through workspaces with $mainMod + HJKL
binde = $mainMod,       H,      workspace,       e-1
binde = $mainMod,       J,      workspace,       empty
binde = $mainMod,       K,      workspace,       1
binde = $mainMod,       L,      workspace,       e+1

# Move active window to a workspace with $mainMod + SHIFT + HJKL
binde = $mainMod SHIFT, H,      movetoworkspace, r-1
binde = $mainMod SHIFT, J,      movetoworkspace, empty
binde = $mainMod SHIFT, K,      movetoworkspace, 1
binde = $mainMod SHIFT, L,      movetoworkspace, r+1

# Switch workspaces with $mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with $mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special audio and music workspaces
bind = $mainMod,       A, togglespecialworkspace, audio
bind = $mainMod,       S, togglespecialworkspace, music
bind = $mainMod SHIFT, S, movetoworkspace,        special:music

# Multimedia keys for volume and screen brightness
bindel =      , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+
bindel =      , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindel = SHIFT, XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = SHIFt, XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel =      , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel =      , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel =      , XF86AudioPlay,         exec, playerctl play-pause
bindel =      , XF86AudioPrev,         exec, playerctl previous
bindel =      , XF86AudioNext,         exec, playerctl next
bindel =      , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel =      , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindel =      , XF86Sleep,             exec, hyprlock && systemctl suspend
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



# ~~~~~~~~~~~~~~~~~~~~~~~~~ MOUSE BINDS ~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Actions done with a mouse only work in normal mode

# Scroll through existing workspaces with $mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up,   workspace, e+1


# Move/resize windows with $mainMod + LMB/RMB and dragging
bindm = $mainMod,       mouse:272, movewindow
bindm = $mainMod,       mouse:273, resizewindow 1
bindm = $mainMod SHIFT, mouse:273, resizewindow
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



# ~~~~~~~~~~~~~~~~~~~~~~~~~~ FOCUS MODE ~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Move focus with $mainMod + HJKL

submap = focus

bind = $mainMod, H,      movefocus, l
bind = $mainMod, J,      movefocus, d
bind = $mainMod, K,      movefocus, u
bind = $mainMod, L,      movefocus, r
bind = $mainMod, escape, submap,    reset

submap = reset
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



# ~~~~~~~~~~~~~~~~~~~~~~~~~ RESIZE MODE ~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Resize active by increments of 10 window with $mainMod + ALT + HJKL

submap = resize

bind = $mainMod, H,      resizeactive, -10   0
bind = $mainMod, J,      resizeactive,   0  10
bind = $mainMod, K,      resizeactive,   0 -10
bind = $mainMod, L,      resizeactive,  10   0
bind = $mainMod, escape, submap,       reset

submap = reset
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



# ~~~~~~~~~~~~~~~~~~~~~ MOVE WINDOW MODE ~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Move focused window with $mainMod + hjkl

submap = movefocus

bind = $mainMod, H,      movewindow, l
bind = $mainMod, J,      movewindow, d
bind = $mainMod, K,      movewindow, u
bind = $mainMod, L,      movewindow, r
bind = $mainMod, escape, submap,     reset

submap = reset
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~



# ~~~~~~~~~~~~~~~~~~~~~~~~ STREAMING MODE ~~~~~~~~~~~~~~~~~~~~~~~~~~
submap = streaming

bind = $mainMod, N,      exec,                   obs
bind = $mainMod, S,      togglespecialworkspace, obs
bind = $mainMod, escape, submap,                 reset

submap = reset
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~




# ==================== WINDOWS AND WORKSPACES ======================
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = noblur,                 class:^()$, title:^()$

# Fix Firefox's installed PWAs from not opening in tiling mode
windowrulev2 = tile, initialTitle: WhatsApp.*
windowrulev2 = tile, initialTitle: Messages.*
windowrulev2 = tile, initialTitle: YouTube.*
windowrulev2 = tile, initialTitle: Google.*

# Automatically open the music app, Easy Effects and OBS to their own special workspaces
windowrulev2 = workspace special:music, class:^(tidal-hifi)$
windowrulev2 = workspace special:music, initialTitle: YouTube\ Music.*
windowrulev2 = workspace special:obs,   class:^(com.obsproject.Studio)$

windowrulev2 = workspace special:audio, initialTitle: Easy\ Effects.*

# Make it so Pipewire's Volume Control acts like a pop-up from the taskbar
windowrulev2 = float,                    title:^(Pipewire\ Volume\ Control)$
windowrulev2 = pin,                      title:^(Pipewire\ Volume\ Control)$
windowrulev2 = noinitialfocus,           title:^(Pipewire\ Volume\ Control)$
windowrulev2 = size 470 300,             title:^(Pipewire\ Volume\ Control)$
windowrulev2 = move 100%-w-12 100%-w-57, title:^(Pipewire\ Volume\ Control)$

# Same for the Password Manager
windowrulev2 = float,                    class:^(org.keepassxc.KeePassXC)$
windowrulev2 = pin,                      class:^(org.keepassxc.KeePassXC)$
windowrulev2 = size 940 500,             class:^(org.keepassxc.KeePassXC)$
windowrulev2 = move 100%-w-12 100%-w-57, class:^(org.keepassxc.KeePassXC)$

# Make it so Firefox's Picture-in-Picture is set to the top right of the screen,
# and pin it so it follows you to whatever workspace you go to
windowrulev2 = float,             title:^(Picture-in-Picture)$
windowrulev2 = pin,               title:^(Picture-in-Picture)$
windowrulev2 = noinitialfocus,    title:^(Picture-in-Picture)$
windowrulev2 = size 640 360,      title:^(Picture-in-Picture)$
windowrulev2 = move 100%-w-12 12, title:^(Picture-in-Picture)$

# Same for scrcpy (this is more useful if you do Android app development)
windowrulev2 = noinitialfocus,    class:^(scrcpy)$
windowrulev2 = pin,               class:^(scrcpy)$
windowrulev2 = size 800 360,      class:^(scrcpy)$
windowrulev2 = move 100%-w-12 12, class:^(scrcpy)$

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# ==================================================================

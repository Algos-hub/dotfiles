# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# Loading up rose pine moon's theme
source=~/.config/hypr/rose-pine-moon.conf

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=HDMI-A-1,1920x1080@100Hz,0x0,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# ========================== APP VARIABLES =========================
# Set programs that you use

$terminal        = ~/dotfiles/hypr/.config/hypr/open_terminal.sh
$musicScript     = ~/dotfiles/hypr/.config/hypr/music.sh
$musicSelector   = pgrep rofi > /dev/null 2>&1 && killall rofi || rofi -modi drun -show drun -p "Music" -theme-str 'inputbar {enabled: false;} listview {border: 0; padding: 0;}' -filter 'Music ' -no-fixed-num-lines
$tidal           = pgrep tidal-hifi > /dev/null 2>&1 && hyprctl dispatch togglespecialworkspace tidal || tidal-hifi
$launchYTmusic   = /usr/bin/firefoxpwa site launch 01K2HNY553PNX7QE4QRH84EZS9
$ytmusic         = hyprctl clients | grep YouTube\ Music > /dev/null 2>&1 && hyprctl dispatch togglespecialworkspace music.youtube || $launchYTmusic
$fileManager     = pgrep nautilus > /dev/null 2>&1 && hyprctl dispatch focuswindow initialclass:org.gnome.Nautilus | grep ok || nautilus
$browser         = pgrep firefox > /dev/null 2>&1 && hyprctl dispatch focuswindow initialclass:firefox | grep ok || firefox
$screenshot      = grim
$passwordManager = keepassxc
$menu            = pgrep rofi > /dev/null 2>&1 && killall rofi || rofi -show drun
$internetSearch  = ~/dotfiles/hypr/.config/hypr/rofisearch.sh
$emojis          = pgrep rofi > /dev/null 2>&1 && killall rofi || rofi -modi emoji -show emoji -kb-secondary-copy "" -kb-custom-1 Return -kb-accept-entry Ctrl+C
$volumecontrol   = pgrep pwvucontrol > /dev/null 2>&1 && killall pwvucontrol || pwvucontrol
$easyeffects     = pgrep easyeffects > /dev/null 2>&1 && hyprctl dispatch togglespecialworkspace audio || easyeffects
$obs             = pgrep obs > /dev/null 2>&1 && hyprctl dispatch togglespecialworkspace obs || obs

# ==================================================================


# =========================== AUTOSTART ============================
# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = [workspace special:audio silent] easyeffects
# ==================================================================


# ==================== ENVIRONMENT VARIABLES =======================
# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# ==================================================================


# ======================== LOOK AND FEEL ===========================
# Refer to https://wiki.hyprland.org/Configuring/Variables/

cursor {
    no_hardware_cursors = true
    no_warps            = true
}

general {
    gaps_in    = 5
    gaps_out   = 10
    float_gaps = 10

    border_size = 2

    col.active_border   = $iris
    col.inactive_border = $muted

    resize_on_border = false

    allow_tearing = false

    layout = master
}

decoration {
    rounding = 10

    active_opacity   = 1.0
    inactive_opacity = 0.75

    blur {
        enabled  = true
        size     = 3
        passes   = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled              = true
    workspace_wraparound = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows,     1, 5, myBezier
    animation = windowsOut,  1, 5, default, popin 80%
    animation = border,      1, 5, default
    animation = borderangle, 1, 5, default
    animation = fade,        1, 5, default
    animation = workspaces,  1, 5, default
}

master {
    new_status = slave
    mfact = 0.5
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = true
}
ecosystem {
    no_update_news  = true
    no_donation_nag = true
}
# ==================================================================


# =========================== INPUT ================================
# https://wiki.hyprland.org/Configuring/Variables/#input

input {
    kb_layout  = us
    kb_variant =
    kb_model   =
    kb_options =
    kb_rules   =

    follow_mouse  = 1
    scroll_factor = 0.05

    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}

binds {
    hide_special_on_workspace_change = true
    focus_preferred_method = 1
}
# ==================================================================


# ========================= KEYBINDINGS ============================
# See https://wiki.hyprland.org/Configuring/Keywords/

$mainMod = SUPER

# Quick access to some apps and commands
bind = $mainMod,       Return, exec,       $terminal
bind = $mainMod,       Space,  exec,       $menu
bind = $mainMod,       E,      exec,       $fileManager
bind = $mainMod,       B,      exec,       $browser
bind = $mainMod,       A,      exec,       $easyeffects
bind = $mainMod,       S,      exec,       $musicScript
bind = $mainMod CTRL,  S,      exec,       $musicSelector
bind = $mainMod,       X,      exec,       $tidal
bind = $mainMod,       D,      exec,       $ytmusic
bind = $mainMod,       G,      exec,       $screenshot
bind = $mainMod,       P,      exec,       $passwordManager
bind = $mainMod,       C,      exec,       $volumecontrol
bind = $mainMod SHIFT, S,      exec,       $obs             #Optional
bind = $mainMod SHIFT, Space,  exec,       $emojis
bind = $mainMod CTRL,  Space,  exec,       $internetSearch
bind = $mainMod SHIFT, Q,      killactive,
bind = $mainMod SHIFT, E,      exit,
# bind = $mainMod SHIFT, R,      exec,       reboot
bind = $mainMod SHIFT, O,      exec,       shutdown -h now

# Switching the window's mode
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating,
bind = $mainMod, T, togglesplit,
bind = $mainMod, W, cyclenext

# Cycle through workspaces with $mainMod + HJKL
binde = $mainMod, H, workspace, e-1
binde = $mainMod, J, workspace, m~2147483647
binde = $mainMod, K, workspace, 1
binde = $mainMod, L, workspace, e+1

# Change focus with $mainMod + CTRL + HJKL
binde = $mainMod CTRL, H, movefocus, l
binde = $mainMod CTRL, J, movefocus, d
binde = $mainMod CTRL, K, movefocus, u
binde = $mainMod CTRL, L, movefocus, r

# Move the currently focused window with $mainMod + ALT + HJKL
binde = $mainMod ALT, H, exec,       ~/dotfiles/hypr/.config/hypr/move_window_left.sh
binde = $mainMod ALT, J, movewindow, d
binde = $mainMod ALT, K, movewindow, u
binde = $mainMod ALT, L, exec,       ~/dotfiles/hypr/.config/hypr/move_window_right.sh

# Resize the currently focused window with $mainMod + CTRL + ALT + HJKL
binde = $mainMod CTRL ALT, H, resizeactive, -10   0
binde = $mainMod CTRL ALT, J, resizeactive,   0  10
binde = $mainMod CTRL ALT, K, resizeactive,   0 -10
binde = $mainMod CTRL ALT, L, resizeactive,  10   0

# Move active window to a workspace with $mainMod + SHIFT + HJKL
binde = $mainMod SHIFT, H, movetoworkspace, r-1
binde = $mainMod SHIFT, H, movewindow,      r
binde = $mainMod SHIFT, J, movetoworkspace, empty
binde = $mainMod SHIFT, K, movetoworkspace, 1
binde = $mainMod SHIFT, L, movetoworkspace, r+1
binde = $mainMod SHIFT, L, movewindow,      l

# Switch workspaces with $mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with $mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Multimedia keys for volume and screen brightness
bindel =      , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+ -l 1
bindel =      , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%- -l 1
bindel = SHIFT, XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+ -l 1
bindel = SHIFT, XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%- -l 1
bindel =      , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel =      , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel =      , XF86AudioPlay,         exec, playerctl play-pause
bindel =      , XF86AudioPrev,         exec, playerctl previous
bindel =      , XF86AudioNext,         exec, playerctl next
bindel =      , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel =      , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindel =      , XF86Sleep,             exec, hyprlock && systemctl suspend

# MOUSE BINDS
# Scroll through existing workspaces with $mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up,   workspace, e+1

# Move/resize windows with $mainMod + LMB/RMB and dragging
bindm = $mainMod,       mouse:272, movewindow
bindm = $mainMod,       mouse:273, resizewindow 1
bindm = $mainMod SHIFT, mouse:273, resizewindow
# ==================================================================





# ==================== WINDOWS AND WORKSPACES ======================
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrule = suppress_event maximize, match:class .*
windowrule = no_blur on, match:class ^()$, match:title ^()$

# Automatically open any new app in the next available workspace,
# except for the music apps, Easy Effects and OBS which go to their own special workspaces
windowrule = workspace emptynm, match:class .*, match:title .*
windowrule = workspace special:tidal, match:class ^(tidal-hifi)$
windowrule = workspace special:music.youtube, match:initial_title YouTube\ Music.*
windowrule = workspace special:audio, match:class ^(com.github.wwmm.easyeffects)$
windowrule = workspace special:obs, match:class ^(com.obsproject.Studio)$

# Make it so Pipewire's Volume Control acts like a pop-up from the taskbar
windowrule {
    name = Volume-Control
    match:class = ^(com.saivert.pwvucontrol)$

    float = on
    pin = on
    no_initial_focus = on
    size = 550 300
    move = (monitor_w*1)-window_w-12 (monitor_h*1)-window_h-57
    opacity = 1 override
}

# Same for the Password Manager
windowrule {
    name = Password-Manager
    match:class = ^(org.keepassxc.KeePassXC)$

    float = on
    pin = on
    size = 940 500
    move = (monitor_w*1)-window_w-12 (monitor_h*1)-window_h-57
}

# Make it so Firefox's Picture-in-Picture is set to the top right of the screen,
# and pin it so it follows you to whatever workspace you go to
# also make it's opacity always at 100%, whether focused or not.
windowrule {
    name = Picture-in-Picture
    match:title = ^(Picture-in-Picture)$

    float = on
    pin = on
    no_initial_focus = on
    size = 640 360
    move = (monitor_w*1)-window_w-12 12
    opacity = 1 override
}

# Same for scrcpy (this is more useful if you do Android app development)
windowrule {
    name = Scrcpy
    match:class = ^(scrcpy)$

    float = on
    pin = on
    no_initial_focus = on
    size = 800 360
    move = (monitor_w*1)-window_w-12 12
    opacity = 1 override
}

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# ==================================================================
